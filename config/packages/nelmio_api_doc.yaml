nelmio_api_doc:
  documentation:
    info:
      title: My App
      description: This is an awesome app!
      version: 1.0.0
    security:
      - bearerAuth: [ ]
    components:
      securitySchemes:
        bearerAuth:
          type: http
          scheme: bearer
          bearerFormat: JWT
  areas: # to filter documented areas
    path_patterns:
      - ^/api(?!/doc$) # Accepts routes under /api except /api/doc
  html_config:
    swagger_ui_config:
      deepLinking: true              # Permet le partage de liens directs vers les opérations
      displayOperationId: true       # Affiche les IDs des opérations
      displayRequestDuration: true   # Affiche la durée des requêtes
      docExpansion: list             # Contrôle l'expansion des sections (list, full, none)
      defaultModelRendering: example
